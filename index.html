<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIAbetes AI — Live Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3b82f6;--purple:#8b5cf6;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--orange:#ea580c;--dark:#0f172a;--darker:#020617}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;overflow-x:hidden}

/* NAVBAR */
.navbar{background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-left{display:flex;align-items:center;gap:10px}
.nav-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:white}
.nav-title{font-weight:700;font-size:15px;color:white}
.nav-sub{font-size:10px;color:#64748b}
.nav-center{display:flex;gap:3px;background:rgba(255,255,255,0.04);padding:3px;border-radius:9px}
.nav-tab{padding:7px 16px;border-radius:7px;border:none;background:transparent;color:#64748b;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
.nav-tab.active{background:white;color:#0f172a}
.nav-tab:hover:not(.active){color:#cbd5e1}
.nav-right{display:flex;align-items:center;gap:8px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.live-text{font-size:11px;color:#22c55e;font-weight:600}

/* PAGES */
.page{display:none;animation:fadeIn 0.3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== FORM SELECTOR PAGE ===== */
.selector-page{padding:30px 20px;max-width:1100px;margin:0 auto}
.selector-header{text-align:center;margin-bottom:30px}
.selector-header h1{font-size:28px;font-weight:800;margin-bottom:6px}
.selector-header h1 span{background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.selector-header p{color:#64748b;font-size:14px}

.form-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:20px;cursor:pointer;transition:all 0.3s;position:relative;overflow:hidden}
.form-card:hover{transform:translateY(-3px);border-color:rgba(59,130,246,0.3);box-shadow:0 8px 30px rgba(59,130,246,0.1)}
.form-card.selected{border-color:var(--blue);background:rgba(59,130,246,0.08)}
.form-card-icon{font-size:32px;margin-bottom:10px}
.form-card-name{font-size:14px;font-weight:700;margin-bottom:4px}
.form-card-ministry{font-size:11px;color:#64748b;margin-bottom:8px}
.form-card-fields{font-size:11px;color:var(--blue);font-weight:600}
.form-card-badge{position:absolute;top:10px;right:10px;font-size:9px;padding:3px 8px;border-radius:6px;font-weight:700}
.badge-easy{background:rgba(34,197,94,0.15);color:#4ade80}
.badge-medium{background:rgba(234,179,8,0.15);color:#fbbf24}
.badge-hard{background:rgba(239,68,68,0.15);color:#f87171}

.start-btn{display:block;margin:24px auto 0;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;border:none;padding:14px 40px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 20px rgba(59,130,246,0.3)}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,0.4)}
.start-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* ===== DEMO PAGE ===== */
.demo-page{padding:16px;max-width:1350px;margin:0 auto}
.demo-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.demo-top-left{display:flex;align-items:center;gap:12px}
.back-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
.back-btn:hover{background:rgba(255,255,255,0.1);color:white}
.demo-form-name{font-size:14px;font-weight:700}
.demo-top-right{display:flex;align-items:center;gap:10px}
.time-compare{display:flex;gap:8px}
.time-box{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.time-manual{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171}
.time-ai{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80;display:none}
.time-ai.show{display:flex}

.demo-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}

/* GOVERNMENT FORM */
.govt-form{background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.form-head{padding:18px 20px;color:white;display:flex;align-items:center;gap:12px}
.form-emblem{width:42px;height:42px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.form-head-text h2{font-size:15px;font-weight:700}
.form-head-text p{font-size:11px;opacity:0.8}
.form-head-scheme{margin-top:6px;font-size:11px;background:rgba(255,255,255,0.1);padding:4px 10px;border-radius:5px;display:inline-block}

/* Progress */
.fill-bar{background:#f0fdf4;border-bottom:1px solid #dcfce7;padding:10px 20px;display:none;align-items:center;gap:10px}
.fill-bar.show{display:flex}
.fill-spinner{width:14px;height:14px;border:2px solid #22c55e;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.fill-label{font-size:12px;color:#166534;font-weight:600;white-space:nowrap}
.fill-track{flex:1;height:5px;background:#dcfce7;border-radius:3px;overflow:hidden}
.fill-gauge{height:100%;background:#22c55e;border-radius:3px;width:0%;transition:width 0.3s}
.fill-count{font-size:11px;color:#166534;font-weight:700;white-space:nowrap}

/* Sections */
.form-section{border-top:1px solid #f1f5f9}
.form-section-head{padding:12px 20px 6px;font-size:11px;font-weight:700;color:#ea580c;text-transform:uppercase;letter-spacing:0.5px}
.form-fields{padding:8px 20px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ff{display:flex;flex-direction:column;gap:3px}
.ff.full{grid-column:1/-1}
.ff label{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.3px}
.ff input,.ff select{padding:9px 11px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:12px;background:#f8fafc;color:#94a3b8;transition:all 0.4s;outline:none;font-family:inherit}
.ff input.filled{border-color:#86efac;background:#f0fdf4;color:#166534;font-weight:600;box-shadow:0 0 0 2px rgba(34,197,94,0.08)}
.ff input.error{border-color:#fca5a5;background:#fef2f2;color:#dc2626;font-weight:600;box-shadow:0 0 0 2px rgba(239,68,68,0.08)}
.ff input.warning{border-color:#fde68a;background:#fefce8;color:#a16207;font-weight:600;box-shadow:0 0 0 2px rgba(234,179,8,0.08)}

/* Submit */
.form-bottom{padding:14px 20px 18px}
.form-submit-btn{width:100%;padding:12px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.3s;background:#e2e8f0;color:#94a3b8}
.form-submit-btn.ready{background:linear-gradient(135deg,#22c55e,#16a34a);color:white;box-shadow:0 4px 15px rgba(34,197,94,0.3)}

/* ===== FB PANEL ===== */
.fb-panel{background:linear-gradient(180deg,#0f172a,#1e293b);border-radius:14px;color:white;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.3);position:sticky;top:60px}
.fb-head{padding:16px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
.fb-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;flex-shrink:0}
.fb-h-name{font-weight:700;font-size:15px}
.fb-h-tag{font-size:10px;color:#475569}

/* Status */
.fb-status{padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.fb-s{display:flex;align-items:center;gap:7px;font-size:11px}
.s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-green{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,0.5)}
.s-blue{background:#3b82f6;box-shadow:0 0 6px rgba(59,130,246,0.5)}
.s-purple{background:#8b5cf6;box-shadow:0 0 6px rgba(139,92,246,0.5)}

/* Sources */
.fb-src{padding:10px 16px}
.fb-src-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#475569;margin-bottom:8px;font-weight:700}
.src-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.src-chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:7px;padding:6px 8px;display:flex;align-items:center;gap:5px;font-size:10px;color:#94a3b8}
.src-chip .ck{color:#22c55e;font-size:11px;margin-left:auto}
.src-chip.expired{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)}
.src-chip.expired .ck{color:#f87171}

/* Voice */
.fb-voice{padding:8px 16px}
.voice-btn{width:100%;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s}
.voice-btn:hover{background:rgba(255,255,255,0.06);color:white}
.voice-btn.listening{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.08);color:#f87171;animation:pulse-voice 1.5s infinite}
@keyframes pulse-voice{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.2)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
.voice-text{padding:6px 16px;font-size:11px;color:#64748b;display:none;text-align:center;font-style:italic}
.voice-text.show{display:block}

/* Auto-fill */
.fb-action{padding:8px 16px}
.af-btn{width:100%;padding:13px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.3s;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;box-shadow:0 4px 20px rgba(59,130,246,0.3)}
.af-btn:hover{transform:translateY(-1px);box-shadow:0 6px 25px rgba(59,130,246,0.4)}
.af-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.af-btn.filling{background:linear-gradient(135deg,#1d4ed8,#6d28d9);animation:pulse-btn 1.5s infinite}
@keyframes pulse-btn{0%,100%{box-shadow:0 4px 20px rgba(59,130,246,0.3)}50%{box-shadow:0 4px 30px rgba(59,130,246,0.6)}}
.af-btn.done{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 20px rgba(34,197,94,0.3)}

/* Edge Cases / Alerts */
.fb-alerts{padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}
.alert{border-radius:9px;padding:10px;display:none}
.alert.show{display:block;animation:slideUp 0.4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.alert-warn{background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.2)}
.alert-err{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2)}
.alert-ok{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2)}
.alert-info{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2)}
.alert-head{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;margin-bottom:4px}
.alert-warn .alert-head{color:#fbbf24}
.alert-err .alert-head{color:#f87171}
.alert-ok .alert-head{color:#4ade80}
.alert-info .alert-head{color:#60a5fa}
.alert-body{font-size:10px;color:#94a3b8;line-height:1.5}
.alert-body strong{color:#cbd5e1}

/* Edge case log */
.edge-log{padding:8px 16px}
.edge-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#475569;margin-bottom:6px;font-weight:700}
.edge-item{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:10px}
.edge-icon{flex-shrink:0;margin-top:1px}
.edge-text{color:#94a3b8}
.edge-text strong{color:#cbd5e1}

/* Footer */
.fb-foot{padding:10px 16px 14px}
.fb-foot-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:7px;padding:8px;text-align:center;font-size:10px;color:#475569}

/* RESPONSIVE */
@media(max-width:900px){
  .demo-grid{grid-template-columns:1fr}
  .fb-panel{position:static}
  .form-cards{grid-template-columns:repeat(2,1fr)}
  .form-fields{grid-template-columns:1fr}
  .nav-center{display:none}
}
@media(max-width:500px){
  .form-cards{grid-template-columns:1fr}
  .time-compare{flex-direction:column}
}
</style>
</head>

// ===== BUILD FORM SELECTOR =====
function buildSelector() {
  const container = document.getElementById('formCards');
  container.innerHTML = '';
  Object.entries(FORMS).forEach(([key, form]) => {
    container.innerHTML += `
      <div class="form-card" data-form="${key}" onclick="selectForm('${key}',this)">
        <div class="form-card-badge ${form.badge}">${form.badgeText}</div>
        <div class="form-card-icon">${form.icon}</div>
        <div class="form-card-name">${form.name}</div>
        <div class="form-card-ministry">${form.ministry}</div>
        <div class="form-card-fields">⏱️ Manual: ${form.manualTime}</div>
      </div>
    `;
  });
}

let selectedForm = null;

function selectForm(key, el) {
  document.querySelectorAll('.form-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedForm = key;
  document.getElementById('startBtn').disabled = false;
}

function launchDemo() {
  if (!selectedForm) return;
  buildDemo(selectedForm);
  switchTab('demo', document.getElementById('demoTab'));
}

// ===== VOICE SIMULATION =====
function simulateVoice() {
  const btn = document.getElementById('voiceBtn');
  const text = document.getElementById('voiceText');
  btn.classList.add('listening');
  btn.innerHTML = '🔴 Listening...';
  text.classList.add('show');
  text.textContent = '';

  const phrase = '"UP scholarship ka form bhar do"';
  let i = 0;
  const typeInt = setInterval(() => {
    if (i < phrase.length) {
      text.textContent = phrase.substring(0, i + 1);
      i++;
    } else {
      clearInterval(typeInt);
      setTimeout(() => {
        btn.classList.remove('listening');
        btn.innerHTML = '✅ Command Received!';
        text.textContent = '🧠 Understood: "Fill UP scholarship form" → Mapping fields...';
        setTimeout(() => {
          if (selectedForm) runAutoFill(selectedForm);
        }, 800);
      }, 500);
    }
  }, 60);
}

// ===== AUTO-FILL ENGINE =====
let filling = false;

function runAutoFill(formKey) {
  if (filling) return;
  filling = true;

  const form = FORMS[formKey];
  const afBtn = document.getElementById('afBtn');
  const fillBar = document.getElementById('fillBar');
  const fillGauge = document.getElementById('fillGauge');
  const fillLabel = document.getElementById('fillLabel');
  const fillCount = document.getElementById('fillCount');
  const aiTimeBox = document.getElementById('aiTimeBox');
  const aiTime = document.getElementById('aiTime');

  // Collect all fields
  let allFields = [];
  form.sections.forEach(s => s.fields.forEach(f => allFields.push(f)));
  const total = allFields.length;

  afBtn.innerHTML = '⏳ AI Mapping Fields...';
  afBtn.classList.add('filling');
  afBtn.disabled = true;
  fillBar.classList.add('show');
  aiTimeBox.classList.add('show');

  let filled = 0;
  let startTime = Date.now();

  // Timer
  const timerInt = setInterval(() => {
    aiTime.textContent = ((Date.now() - startTime) / 1000).toFixed(1);
  }, 100);

  // Fill each field with typing animation
  allFields.forEach((field, idx) => {
    setTimeout(() => {
      const input = document.getElementById('df-' + field.id);
      if (!input) { filled++; return; }

      const value = field.val;
      let ci = 0;

      // Add appropriate class
      if (field.warn) {
        input.classList.add('warning');
      } else {
        input.classList.add('filled');
      }

      // Typing effect
      const tInt = setInterval(() => {
        if (ci < value.length) {
          input.value = value.substring(0, ci + 1);
          ci++;
        } else {
          clearInterval(tInt);
        }
      }, 15);

      filled++;
      const pct = Math.round((filled / total) * 100);
      fillGauge.style.width = pct + '%';
      fillLabel.textContent = `Filling: ${filled}/${total}`;
      fillCount.textContent = pct + '%';

      // Done!
      if (filled === total) {
        clearInterval(timerInt);
        setTimeout(() => {
          afBtn.innerHTML = `✅ All ${total} Fields Filled!`;
          afBtn.classList.remove('filling');
          afBtn.classList.add('done');
          fillLabel.textContent = `✅ Complete — ${total}/${total} fields`;

          document.getElementById('formSubmitBtn').textContent = '✅ Ready to Submit with Aadhaar eSign';
          document.getElementById('formSubmitBtn').classList.add('ready');

          // Show alerts sequentially
          form.alerts.forEach((a, i) => {
            setTimeout(() => {
              const alEl = document.getElementById(`al-${formKey}-${i}`);
              if (alEl) alEl.classList.add('show');
            }, a.delay - 2000);
          });

          // Show edge cases
          const edgeItems = document.querySelectorAll('[data-edge]');
          edgeItems.forEach((el, i) => {
            setTimeout(() => {
              el.style.display = 'flex';
              el.style.animation = 'slideUp 0.3s ease';
            }, 1000 + i * 500);
          });

          filling = false;
        }, 400);
      }
    }, idx * 160);
  });
}

// ===== EDGE CASES PAGE =====
function buildEdgeCases() {
  const container = document.getElementById('edgeCasesList');
  const colors = {yellow:'#fbbf24',red:'#f87171',blue:'#60a5fa',green:'#4ade80'};
  const bgs = {yellow:'rgba(234,179,8,0.06)',red:'rgba(239,68,68,0.06)',blue:'rgba(59,130,246,0.06)',green:'rgba(34,197,94,0.06)'};
  const borders = {yellow:'rgba(234,179,8,0.15)',red:'rgba(239,68,68,0.15)',blue:'rgba(59,130,246,0.15)',green:'rgba(34,197,94,0.15)'};

  container.innerHTML = '';
  EDGE_CASES.forEach(ec => {
    container.innerHTML += `
      <div style="background:${bgs[ec.severity]};border:1px solid ${borders[ec.severity]};border-radius:12px;padding:18px">
        <div style="font-size:24px;margin-bottom:8px">${ec.icon}</div>
        <div style="font-size:13px;font-weight:700;color:${colors[ec.severity]};margin-bottom:6px">${ec.title}</div>
        <div style="font-size:12px;color:#94a3b8;line-height:1.6">${ec.desc}</div>
      </div>
    `;
  });
}

// ===== NAVIGATION =====
function switchTab(page, tabEl) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('pg-' + page).classList.add('active');
  if (tabEl) tabEl.classList.add('active');

  // Reset filling state when going back
  if (page === 'selector') {
    filling = false;
    selectedForm = null;
    document.getElementById('startBtn').disabled = true;
    document.querySelectorAll('.form-card').forEach(c => c.classList.remove('selected'));
  }
}
